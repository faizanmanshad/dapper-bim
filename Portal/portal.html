<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Dapper.BIM</title>
    
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .portal-body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark); }
        .portal-card { background: var(--card-bg); padding: 3rem; border: 1px solid var(--border-color); width: 100%; max-width: 450px; border-top: 3px solid var(--neon-purple); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .form-input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 1rem; font-family: 'Inter', sans-serif; transition: border-color 0.3s; }
        .form-input:focus { outline: none; border-color: var(--neon-purple); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="portal-body">

    <a href="../index.html" style="position: absolute; top: 2rem; left: 2rem; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
        <i class="ph ph-arrow-left"></i> Back to Site
    </a>

    <div id="auth-section" class="portal-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 id="form-title">Access Portal</h2>
            <p id="form-subtitle" class="mono-small text-muted">Sign in to manage your licenses.</p>
        </div>

        <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="text" id="full-name" placeholder="Full Name" class="form-input hidden">
            <input type="email" id="email" placeholder="Email Address" required class="form-input">
            <input type="password" id="password" placeholder="Password" required class="form-input">
            
            <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem;">LOG IN</button>
            <p id="status-msg" class="mono-small text-center"></p>
        </form>

        <div style="display: flex; align-items: center; margin: 2rem 0 1rem 0;">
            <hr style="flex: 1; border-color: var(--border-color);">
            <span class="mono-small text-muted" style="padding: 0 1rem;">OR</span>
            <hr style="flex: 1; border-color: var(--border-color);">
        </div>
        
        <button type="button" id="google-btn" class="btn btn-outline btn-full" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0; background-color: white; color: black; border: none;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 20px; height: 20px;">
            Continue with Google
        </button>

        <p class="mono-small text-center" style="margin-top: 2rem;">
            <span id="toggle-text">Don't have an account?</span> 
            <a href="#" id="toggle-link" class="text-blue" style="text-decoration: none;">Sign Up</a>
        </p>
    </div>

    <script src="portal.js"></script>
</body>
</html>
